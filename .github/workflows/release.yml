name: Release

# Publishing is kept out of ci.yml so it never runs for untrusted pull requests.
# `main` is protected and only receives green PRs, so every commit here already passed CI.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------------
  # Optional continuous deployment to Kubernetes.
  #
  # How it hooks in: add a repository secret `KUBE_CONFIG` (a base64-encoded kubeconfig
  # for a deploy-only service account) and, optionally, protection rules (required
  # reviewers, tag-only deployment) on the GitHub Environment `production`. Version tags
  # are then rolled out with `kubectl apply -k deploy/k8s`, pinned to the image digest
  # that was just published. Without the secret the gate below reports "disabled" and
  # the deploy job is skipped, so the workflow stays green on forks and fresh clones.
  # (Job-level `if:` cannot read `secrets`, hence the small gate job.)
  # ---------------------------------------------------------------------------------
  deploy-gate:
    name: Deploy gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check for KUBE_CONFIG secret
        id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG present: deployment enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG secret not set; skipping Kubernetes deployment."
          fi

  deploy:
    name: Deploy to production
    needs: [publish, deploy-gate]
    if: needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NAMESPACE: research-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s

      - name: Pin image to the published digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}"
          kubectl -n "$NAMESPACE" set image deployment/research-api api="$image"
          kubectl -n "$NAMESPACE" set image deployment/research-worker worker="$image"

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/research-api --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/research-worker --timeout=10m
