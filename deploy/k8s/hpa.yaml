# CPU-based autoscaling. Workers are mostly IO-bound (waiting on Claude), so CPU is a weak
# signal for them; queue-depth scaling (e.g. KEDA on the Redis list length) is the follow-up.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: research-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: research-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: research-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: research-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Scale in slowly: a removed worker gets SIGTERM and must drain its running jobs.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
