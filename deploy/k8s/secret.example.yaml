# EXAMPLE ONLY - not referenced by kustomization.yaml and never applied automatically.
# Do not commit real values. Prefer creating the secret out of band:
#
#   kubectl -n research-assistant create secret generic research-assistant-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=API_KEYS=<key1>,<key2>
#
# or manage it with External Secrets / Sealed Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: research-assistant-secrets
  namespace: research-assistant
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
  # Comma-separated keys clients send in the X-API-Key header.
  API_KEYS: "REPLACE-WITH-A-LONG-RANDOM-KEY"
